<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <meta name="description" content="GTU BBA Semester 1 PDF Tracker — Track downloads and prints for all your study material." />
  <meta name="theme-color" content="#faf8f5" />
  <title>GTU BBA · PDF Tracker</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app" id="app">

    <!-- HEADER -->
    <header class="header">
      <div class="header-badges">
        <span class="header-badge">GTU BBA · Sem 1</span>
        <span class="cloud-badge syncing" id="cloudBadge">
          <span class="cloud-dot"></span>
          <span class="cloud-text">Connecting...</span>
        </span>
      </div>
      <h1 class="header-title">My PDF Tracker</h1>
      <p class="header-sub">Personal Study Dashboard & Material Manager</p>
    </header>

    <!-- STATS DASHBOARD -->
    <section class="stats" id="stats">
      <div class="stat-card stat-total">
        <div class="stat-icon">📄</div>
        <div class="stat-info">
          <span class="stat-value" id="statTotal">0</span>
          <span class="stat-label">Total</span>
        </div>
      </div>
      <div class="stat-card stat-downloaded">
        <div class="stat-icon">📥</div>
        <div class="stat-info">
          <span class="stat-value" id="statDownloaded">0</span>
          <span class="stat-label">Downloaded</span>
        </div>
      </div>
      <div class="stat-card stat-printed">
        <div class="stat-icon">🖨️</div>
        <div class="stat-info">
          <span class="stat-value" id="statPrinted">0</span>
          <span class="stat-label">Printed</span>
        </div>
      </div>
      <div class="stat-card stat-pending">
        <div class="stat-icon">⏳</div>
        <div class="stat-info">
          <span class="stat-value" id="statPending">0</span>
          <span class="stat-label">Pending</span>
        </div>
      </div>
    </section>

    <!-- PROGRESS -->
    <section class="progress-wrap">
      <div class="progress-top">
        <span class="progress-label">Overall Progress</span>
        <span class="progress-pct" id="progressPct">0%</span>
      </div>
      <div class="progress-track">
        <div class="progress-fill" id="progressFill"></div>
      </div>
    </section>

    <!-- TOOLBAR -->
    <section class="toolbar">
      <div class="search-box">
        <svg class="search-icon" viewBox="0 0 20 20" fill="currentColor" width="16" height="16"><path fill-rule="evenodd" d="M8 4a4 4 0 100 8 4 4 0 000-8zM2 8a6 6 0 1110.89 3.476l4.817 4.817a1 1 0 01-1.414 1.414l-4.816-4.816A6 6 0 012 8z" clip-rule="evenodd"/></svg>
        <input type="text" id="searchInput" class="search-input" placeholder="Search subjects or parts…" />
      </div>
      <div class="filters" id="filters">
        <button class="pill active" data-filter="all">All</button>
        <button class="pill" data-filter="pending">Pending</button>
        <button class="pill" data-filter="downloaded">Downloaded</button>
        <button class="pill" data-filter="printed">Printed</button>
      </div>
    </section>

    <!-- ACTIONS -->
    <section class="actions">
      <button class="btn btn-accent" id="btnAddSubject" onclick="App.openAddSubjectModal()">
        <svg viewBox="0 0 20 20" fill="currentColor" width="15" height="15"><path fill-rule="evenodd" d="M10 3a1 1 0 011 1v5h5a1 1 0 110 2h-5v5a1 1 0 11-2 0v-5H4a1 1 0 110-2h5V4a1 1 0 011-1z" clip-rule="evenodd"/></svg>
        Add Subject
      </button>
      <button class="btn btn-ghost" onclick="App.exportData()">
        <svg viewBox="0 0 20 20" fill="currentColor" width="14" height="14"><path fill-rule="evenodd" d="M3 17a1 1 0 011-1h12a1 1 0 110 2H4a1 1 0 01-1-1zm3.293-7.707a1 1 0 011.414 0L9 10.586V3a1 1 0 112 0v7.586l1.293-1.293a1 1 0 111.414 1.414l-3 3a1 1 0 01-1.414 0l-3-3a1 1 0 010-1.414z" clip-rule="evenodd"/></svg>
        Export
      </button>
      <button class="btn btn-ghost" onclick="document.getElementById('importInput').click()">
        <svg viewBox="0 0 20 20" fill="currentColor" width="14" height="14"><path fill-rule="evenodd" d="M3 17a1 1 0 011-1h12a1 1 0 110 2H4a1 1 0 01-1-1zM6.293 6.707a1 1 0 010-1.414l3-3a1 1 0 011.414 0l3 3a1 1 0 01-1.414 1.414L11 5.414V13a1 1 0 11-2 0V5.414L7.707 6.707a1 1 0 01-1.414 0z" clip-rule="evenodd"/></svg>
        Import
      </button>
      <input type="file" id="importInput" accept=".json" onchange="App.importData(event)" hidden />
    </section>

    <!-- SUBJECTS -->
    <main class="subjects" id="subjectsContainer"></main>

    <!-- EMPTY STATE -->
    <div class="empty" id="emptyState" style="display:none">
      <div class="empty-icon">🔍</div>
      <p>No results match your search or filter.</p>
    </div>

    <!-- FOOTER -->
    <footer class="footer">GTU BBA PDF Tracker · Cloud Synced</footer>
  </div>

  <!-- ADD SUBJECT MODAL -->
  <div class="overlay" id="addSubjectModal">
    <div class="modal">
      <h3>Add New Subject</h3>
      <div class="field">
        <label for="newSubName">Subject Name</label>
        <input type="text" id="newSubName" class="input" placeholder="e.g. Marketing Management" />
      </div>
      <div class="field">
        <label for="newSubCode">Subject Code</label>
        <input type="text" id="newSubCode" class="input" placeholder="e.g. S1-MM" />
      </div>
      <div class="field">
        <label for="newSubUnits">Number of Units</label>
        <input type="number" id="newSubUnits" class="input" min="1" max="20" value="5" />
      </div>
      <div class="modal-btns">
        <button class="btn btn-ghost" onclick="App.closeModal('addSubjectModal')">Cancel</button>
        <button class="btn btn-accent" onclick="App.addSubject()">Add</button>
      </div>
    </div>
  </div>

  <!-- TOAST -->
  <div class="toasts" id="toasts"></div>

  <!-- FIREBASE SDKs -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>

  <!-- APP SCRIPTS -->
  <script src="data.js"></script>
  <script src="cloud.js"></script>
  <script src="app.js"></script>
</body>
</html>
